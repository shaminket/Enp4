<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cuatreros del 415 • Prepa 4 UNAM | Ecosistema Digital</title>
  <meta name="description" content="Portal oficial ultra-disruptivo del Grupo 0415, Escuela Nacional Preparatoria Plantel 4 'Vidal Castañeda y Nájera' UNAM. Horarios en vivo, tareas, avisos y Encardomy.">
  <link rel="icon" href="assets/escudo-unam-original.png" type="image/png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; }
    body {
      background: radial-gradient(ellipse at center, #001628 0%, #000a14 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }
    .dispatch-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid rgba(213, 159, 15, 0.4);
      border-radius: 28px;
      padding: 3rem 2.5rem;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 25px 70px rgba(0,0,0,0.6), 0 0 40px rgba(0, 122, 255, 0.2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: pulseGlow 3s infinite alternate ease-in-out;
    }
    @keyframes pulseGlow {
      from { border-color: rgba(213, 159, 15, 0.3); box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
      to { border-color: rgba(0, 122, 255, 0.6); box-shadow: 0 25px 70px rgba(0, 122, 255, 0.35); }
    }
    .crest-cluster {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1.8rem;
    }
    .crest-cluster img {
      height: 64px;
      width: auto;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.6));
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 40%, #fcd866 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.sub {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .spinner-ring {
      width: 48px;
      height: 48px;
      border: 3.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: #fcd866;
      border-right-color: #007AFF;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
      margin: 0 auto 1.8rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-badge {
      display: inline-block;
      padding: 0.4rem 1.1rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(0, 122, 255, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.4);
      margin-bottom: 2rem;
    }
    .manual-links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 1.5rem;
    }
    .manual-links span {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 0.3rem;
    }
    .btn-row {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-dev {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      padding: 0.5rem 1rem;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-dev:hover {
      background: #007AFF;
      color: #ffffff;
      border-color: #007AFF;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="dispatch-card">
    <div class="crest-cluster">
      <img src="assets/escudo-unam-original.png" alt="UNAM">
      <img src="assets/logo-enp4.svg" alt="ENP 4">
    </div>
    <h1>Cuatreros del 415</h1>
    <p class="sub">Iniciando ecosistema ultra-disruptivo adaptado a tu dispositivo...</p>
    
    <div class="spinner-ring"></div>
    <div class="status-badge" id="dispatchStatus">Calibrando pantalla...</div>

    <div class="manual-links">
      <span>¿Deseas forzar una versión específica?</span>
      <div class="btn-row">
        <a href="mobile.html?force=1" class="btn-dev">📱 Móvil</a>
        <a href="tablet.html?force=1" class="btn-dev">📟 Tableta</a>
        <a href="desktop.html?force=1" class="btn-dev">🖥️ Escritorio</a>
      </div>
    </div>
  </div>

  <script>
    (function dispatchEnvironment() {
      const urlParams = new URLSearchParams(window.location.search);
      const forced = urlParams.get('view');
      if (forced === 'mobile') { window.location.replace('mobile.html'); return; }
      if (forced === 'tablet') { window.location.replace('tablet.html'); return; }
      if (forced === 'desktop') { window.location.replace('desktop.html'); return; }

      const w = window.innerWidth;
      const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      const isMobileUA = /Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      const isTabletUA = /iPad|Tablet|PlayBook/i.test(navigator.userAgent) || (isTouch && w >= 768 && w <= 1024);

      let target = 'desktop.html';
      let label = 'Despachando a Escritorio...';

      if (isMobileUA || (w < 768 && isTouch) || w < 768) {
        target = 'mobile.html';
        label = 'Despachando a Móvil (Modo Flujo Pasillo)...';
      } else if (isTabletUA || (w >= 768 && w <= 1024)) {
        target = 'tablet.html';
        label = 'Despachando a Tableta (Bento Grid)...';
      } else {
        target = 'desktop.html';
        label = 'Despachando a Escritorio (Comando Espacial)...';
      }

      document.getElementById('dispatchStatus').textContent = label;
      setTimeout(() => {
        window.location.replace(target + window.location.search);
      }, 350);
    })();
  </script>
</body>
</html>
